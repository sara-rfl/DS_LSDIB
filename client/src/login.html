<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> iCARAT - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <h1>Bem-vindo ao iCARAT</h1>
        <p>Insira as suas credenciais para aceder</p>
        
        <form id="loginForm">
            <div>
                <label for="email">Email:</label>
                <input type="email" id="email" placeholder="email@exemplo.com" required>
            </div>
            <div>
                <label for="password">Password:</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit">Entrar</button>
        </form>
        <p id="mensagemErro" class="error-message"></p>
    </div>

<script type="module" src="./pages/login.js"></script></body>
</html>
