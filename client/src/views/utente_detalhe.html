<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iCARAT - Detalhe do Utente</title>
    <link rel="stylesheet" href="../styles/dashboard.css">
</head>
<body>
    <nav class="top-nav">
        <h2 class="logo">iCARAT</h2>
        <div style="display:flex; gap:12px; align-items:center;">
            <button onclick="window.location.href='lista_utentes.html'" class="btn-nav">← Voltar</button>
            <button id="btn-logout" class="btn-move-out">Log Out</button>
        </div>
    </nav>

    <main class="container-lista">
        <div class="utente-detalhe-header">
            <div class="modal-avatar" id="utente-avatar" style="width:52px;height:52px;font-size:18px;font-weight:700;"></div>
            <div>
                <h1 id="utente-nome" style="font-size:22px;font-weight:700;color:#1a1a2e;">—</h1>
                <p id="utente-info" style="font-size:14px;color:#6b7280;margin-top:4px;">—</p>
            </div>
        </div>

        <div class="tabs-container">
            <button class="tab-btn active" data-tab="sintomas">Sintomas</button>
            <button class="tab-btn" data-tab="medicacao">Medicação</button>
            <button class="tab-btn" data-tab="carat">Histórico CARAT</button>
            <button class="tab-btn" data-tab="exames">Exames</button>
            <button class="tab-btn" data-tab="notas">Notas Clínicas</button>
        </div>

        <div id="tab-sintomas" class="tab-content">
            <div id="container-sintomas" class="card-tabela">
                <p class="estado-mensagem">A carregar...</p>
            </div>
        </div>

        <div id="tab-medicacao" class="tab-content" style="display:none;">
            <div class="card-tabela" style="padding:24px;margin-bottom:20px;">
                <h3 style="font-size:15px;font-weight:700;color:#1a1a2e;margin-bottom:16px;">Adicionar Medicação</h3>
                <form id="form-medicacao" style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr auto;gap:12px;align-items:end;">
                    <div><label style="font-size:11px;font-weight:600;color:#6b7280;display:block;margin-bottom:4px;">Nome</label><input id="med-nome" type="text" placeholder="Ex: Montelucaste" style="width:100%;padding:10px 14px;border:1.5px solid #e5e7eb;border-radius:8px;font-size:14px;font-family:inherit;outline:none;"></div>
                    <div><label style="font-size:11px;font-weight:600;color:#6b7280;display:block;margin-bottom:4px;">Dose</label><input id="med-dose" type="text" placeholder="Ex: 10mg/dia" style="width:100%;padding:10px 14px;border:1.5px solid #e5e7eb;border-radius:8px;font-size:14px;font-family:inherit;outline:none;"></div>
                    <div><label style="font-size:11px;font-weight:600;color:#6b7280;display:block;margin-bottom:4px;">Data de Início</label><input id="med-inicio" type="date" style="width:100%;padding:10px 14px;border:1.5px solid #e5e7eb;border-radius:8px;font-size:14px;font-family:inherit;outline:none;"></div>
                    <div><label style="font-size:11px;font-weight:600;color:#6b7280;display:block;margin-bottom:4px;">Data de Fim (opcional)</label><input id="med-fim" type="date" style="width:100%;padding:10px 14px;border:1.5px solid #e5e7eb;border-radius:8px;font-size:14px;font-family:inherit;outline:none;"></div>
                    <button type="submit" class="btn-nav">Adicionar</button>
                </form>
            </div>
            <div id="container-medicacao" class="card-tabela">
                <p class="estado-mensagem">A carregar...</p>
            </div>
        </div>

        <div id="tab-carat" class="tab-content" style="display:none;">
            <div style="display:flex;justify-content:flex-end;margin-bottom:16px;">
                <button id="btn-pedir-carat" class="btn-nav">Solicitar Avaliação CARAT</button>
            </div>
            <div id="container-carat" class="card-tabela">
                <p class="estado-mensagem">A carregar...</p>
            </div>
        </div>

        <div id="tab-exames" class="tab-content" style="display:none;">
            <div class="card-tabela" style="padding:24px;margin-bottom:20px;">
                <h3 style="font-size:15px;font-weight:700;color:#1a1a2e;margin-bottom:16px;">Marcar Exame</h3>
                <form id="form-exame" style="display:grid;grid-template-columns:2fr 1fr auto;gap:12px;align-items:end;">
                    <div><label style="font-size:11px;font-weight:600;color:#6b7280;display:block;margin-bottom:4px;">Tipo de Exame</label><select id="exame-tipo" style="width:100%;padding:10px 14px;border:1.5px solid #e5e7eb;border-radius:8px;font-size:14px;font-family:inherit;outline:none;"><option value="">A carregar...</option></select></div>
                    <div><label style="font-size:11px;font-weight:600;color:#6b7280;display:block;margin-bottom:4px;">Data</label><input id="exame-data" type="date" style="width:100%;padding:10px 14px;border:1.5px solid #e5e7eb;border-radius:8px;font-size:14px;font-family:inherit;outline:none;"></div>
                    <button type="submit" class="btn-nav">Marcar</button>
                </form>
                <div style="margin-top:12px;"><label style="font-size:11px;font-weight:600;color:#6b7280;display:block;margin-bottom:4px;">Observações (opcional)</label><textarea id="exame-obs" rows="2" placeholder="Notas clínicas sobre o exame..." style="width:100%;padding:10px 14px;border:1.5px solid #e5e7eb;border-radius:8px;font-size:14px;font-family:inherit;resize:vertical;outline:none;"></textarea></div>
            </div>
            <div id="container-exames" class="card-tabela">
                <p class="estado-mensagem">A carregar...</p>
            </div>
        </div>

        <div id="tab-notas" class="tab-content" style="display:none;">
            <div class="card-tabela" style="padding:24px;margin-bottom:20px;">
                <h3 style="font-size:15px;font-weight:700;color:#1a1a2e;margin-bottom:16px;">Nova Nota Clínica</h3>
                <form id="form-nota">
                    <input type="text" id="nota-titulo" placeholder="Título (opcional)" style="width:100%;padding:10px 14px;border:1.5px solid #e5e7eb;border-radius:8px;font-size:14px;font-family:inherit;margin-bottom:12px;outline:none;">
                    <textarea id="nota-conteudo" placeholder="Escreve a nota clínica aqui..." rows="4" style="width:100%;padding:10px 14px;border:1.5px solid #e5e7eb;border-radius:8px;font-size:14px;font-family:inherit;resize:vertical;outline:none;"></textarea>
                    <button type="submit" class="btn-nav" style="margin-top:12px;">Guardar Nota</button>
                </form>
            </div>
            <div id="container-notas">
                <p class="estado-mensagem">A carregar...</p>
            </div>
        </div>
    </main>

    <script type="module" src="../pages/utente_detalhe.js"></script>
</body>
</html>
